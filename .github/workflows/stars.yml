# Keeps registry/stars.json current: the GitHub star count of every Prism app
# registry/apps.json lists. Every Prism app's frame reads the file from Holo
# Search's Pages site on load, so a new star shows in every app's bar and
# address bar within one run, without any visitor's browser calling GitHub.
# The file is committed only when a count changed; Pages is then rebuilt.
name: GitHub stars

on:
  schedule:
    - cron: "*/10 * * * *"
  watch:
    types: [started]
  push:
    branches: [main]
    paths: [registry/apps.json]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-stars
  cancel-in-progress: false

jobs:
  stars:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read every app's star count
        id: stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "result=$(node bootstrap/stars.mjs)" >> "$GITHUB_OUTPUT"
      - name: Publish the counts that changed
        if: steps.stars.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/stars.json
          git commit -m "registry/stars.json: star counts changed"
          git push
          # A push by this workflow's token starts no other workflow, so ask
          # Pages for the build that serves the new counts.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
