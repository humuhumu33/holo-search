# Keeps the Prism index current: every Prism app that verifies now, with its
# GitHub stars, in registry/index/ (bootstrap/index.mjs). Every Prism app's
# address bar and Holo Search read it from Holo Search's Pages site, so an app
# that registers, a new star or an app that stops verifying shows in every
# app within one run. A changed snapshot is committed and Pages rebuilt;
# an unchanged one commits nothing.
#
# Candidates: registry/apps.json, and, when the repository variable
# PRISM_REGISTRY names the Prism registry, every app that registered there
# from its own deploy.
name: Prism index

on:
  schedule:
    - cron: "*/10 * * * *"
  watch:
    types: [started]
  push:
    branches: [main]
    paths: [registry/apps.json, bootstrap/index.mjs]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: prism-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The verifier, at one version
        run: npm install --no-save --no-package-lock --no-audit --no-fund prism-code@0.5.0
      - name: Verify every candidate and write the snapshot
        id: index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRISM_REGISTRY: ${{ vars.PRISM_REGISTRY }}
        run: echo "result=$(node bootstrap/index.mjs)" >> "$GITHUB_OUTPUT"
      - name: Publish a changed snapshot
        if: steps.index.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/index
          # Snapshots no longer pointed at are dropped; current.json names the one in use.
          keep=$(node -e 'console.log(require("./registry/index/current.json").path)')
          for f in registry/index/*.json; do
            case "$(basename "$f")" in current.json|"$keep") ;; *) git rm -q "$f" ;; esac
          done
          git commit -m "registry/index: $(node -e 'const c=require("./registry/index/current.json");console.log(`${c.apps} app(s), ${c.rejected} rejected`)')"
          # The checkout keeps no credentials; the token is given to this push alone.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
          # A push by this workflow's token starts no other workflow, so ask
          # Pages for the build that serves the new snapshot.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
