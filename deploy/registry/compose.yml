# The Prism side of the canonical kappa registry. kappa itself is the hub's
# (hub-kappa, /root/hub); this adds, on the same Docker network:
#   gateway  the public face at https://$REGISTRY_HOST: anyone reads kappa; a
#            GitHub Actions run registers its own app's address (OIDC, no
#            secret); serves the index at /index/.
#   indexer  kappa's only Prism writer: verifies every app (its bytes stay on
#            its GitHub Pages site) and stores its address card in kappa; lists
#            every AI artifact in the hub's registry by digest.
#   cp .env.example .env && docker compose up -d --build
# The host's Caddy terminates TLS and proxies $REGISTRY_HOST to
# prism-gateway:5001 (Caddyfile in this folder). Data lives in ./data.
services:
  gateway:
    build: .
    container_name: prism-gateway
    command: ["node", "gateway.mjs"]
    environment:
      GATEWAY_LISTEN: 0.0.0.0:5001
      GATEWAY_PUBLIC_URL: https://${REGISTRY_HOST}
      KAPPA_URL: ${KAPPA_URL:-http://hub-kappa:5000}
      GATEWAY_LOG: /data/registrations.jsonl
      OIDC_AUDIENCE: prism-registry
    volumes:
      - ./data:/data
    networks: [edge]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  indexer:
    build: .
    container_name: prism-indexer
    command: ["node", "indexer.mjs"]
    environment:
      DATA: /data
      KAPPA_URL: ${KAPPA_URL:-http://hub-kappa:5000}
      PUBLIC_HOST: ${REGISTRY_HOST}
      ARTIFACTS_URL: ${ARTIFACTS_URL:-http://hub-registry:5000}
      ARTIFACTS_HOST: ${ARTIFACTS_HOST:-hub.uor.foundation}
      DISCOVER_OWNERS: ${DISCOVER_OWNERS}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
    networks: [edge]
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

networks:
  edge:
    name: ${EDGE_NETWORK:-twenty_default}
    external: true
